<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e7eee6">
<title>Darts Stats</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7eee6; --card:#ffffff; --line:#d3ded1; --line2:#e6ece4; --ink:#14211a; --muted:#56635a; --faint:#9aa79d;
  --disp:"Bricolage Grotesque",system-ui,sans-serif; --nav:#183a2a;
  --acc:#1f6f4a; --acc-soft:#e3efe7; --acc-mid:#5f9478; --acc-line:#c6ddcd;
  --warm:#e0703a; --warm-dark:#b04a17; --warm-soft:#fcebe0; --warm-line:#f3cdb3;
  --red:#b42318; --red-soft:#fbeae8;
  --nav-h:62px; --safe-b:env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100%;padding:14px 16px calc(var(--nav-h) + var(--safe-b) + 16px)}
#app.play{height:100%;min-height:0;display:flex;flex-direction:column;gap:10px;padding-bottom:calc(var(--nav-h) + var(--safe-b) + 10px)}
h1{font-family:var(--disp);font-size:31px;font-weight:800;letter-spacing:-.02em;margin:2px 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.muted{color:var(--muted)} .small{font-size:12px} .s13{font-size:13px}
.h2{font-size:15px;font-weight:600;margin:0}
.sub{font-size:12px;color:var(--muted);margin:2px 0 0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;min-height:46px;padding:0 16px;font-size:15px;font-weight:500}
.btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600}
.btn.ghost{background:var(--bg)}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.45;cursor:default}
.grow{flex:1}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.seg{display:flex;gap:4px;background:rgba(31,111,74,.09);border-radius:999px;padding:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:8px 10px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted)}
.seg button.on{background:var(--acc);color:#fff;box-shadow:0 2px 6px rgba(31,111,74,.25)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .l{font-size:13px;color:var(--muted)}
.tile .v{font-size:28px;font-weight:700;letter-spacing:-.02em}
.tile .s{font-size:12px;color:var(--muted)}
.tile .s.up{color:var(--acc)} .tile .s.down{color:var(--red)}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:14px;gap:10px}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{font-weight:600}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.trio div{display:flex;flex-direction:column;gap:2px;min-width:0}
.trio .l{font-size:12px;color:var(--muted)} .trio .v{font-size:17px;font-weight:600}
.bar{flex:1;height:8px;background:var(--line2);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.brow{display:flex;align-items:center;gap:10px;font-size:14px;padding:5px 0}
.brow .lab{width:84px;flex-shrink:0}
.browbtn{display:block;width:100%;background:none;border:0;border-radius:8px;padding:0 4px;margin:0 -4px;text-align:left;font:inherit;color:inherit;cursor:pointer}.browbtn.on{background:var(--acc-soft,#e6f0ea)}
.browbtn .lab{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.brow .n{color:var(--muted);width:52px;text-align:right;flex-shrink:0}
.brow .p{font-weight:600;width:46px;text-align:right;flex-shrink:0}
.stackbar{display:flex;height:14px;border-radius:4px;overflow:hidden;gap:2px}
.dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:12px;color:var(--muted);font-weight:500;text-align:right;padding:0 0 6px;border-bottom:1px solid var(--line2)}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{text-align:right;padding:7px 0;border-bottom:1px solid var(--line2)}
.tbl tr:last-child td{border-bottom:0}
.empty{padding:28px 14px;text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
svg text{font-family:"DM Sans",system-ui,sans-serif}

/* play */
.p-head{display:flex;justify-content:space-between;align-items:center;min-height:34px}
.p-head .t{font-size:15px;font-weight:600}
.rem{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.rem .big{font-size:72px;font-weight:700;line-height:1;letter-spacing:-.03em}
.route{display:flex;gap:6px;padding-bottom:6px;flex-wrap:wrap;justify-content:flex-end}
.route span{font-size:14px;font-weight:600;color:var(--acc);background:var(--acc-soft);border-radius:8px;padding:5px 8px}
.visits{padding:2px 14px;overflow-y:auto;min-height:0;flex-shrink:1}
.vrow{display:flex;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line2)}
.vrow:last-child{border-bottom:0}
.vrow .n{font-size:12px;color:var(--muted);width:16px}
.vrow .s{font-size:17px;font-weight:600;width:40px}
.vrow .d{font-size:13px;color:var(--muted);flex:1;min-width:0}
.vrow .l{font-size:15px;color:var(--muted)}
.vrow.bust .s{color:var(--warm-dark);text-decoration:line-through}
.entry{display:flex;justify-content:space-between;align-items:center;padding:0 4px}
.entry .v{font-size:36px;font-weight:700}
.entry .v.ph{color:var(--faint)}
.keypad{flex:1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(48px,1fr);gap:8px;min-height:220px}
.keypad button{border:1px solid var(--line);background:var(--card);border-radius:14px;font-family:var(--disp);font-size:27px;font-weight:600;box-shadow:0 3px 0 var(--line)}
.keypad button:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.keypad button:active{background:var(--line2)}
.keypad .fn{font-size:15px;color:var(--muted);background:var(--bg)}
.keypad .go{font-family:"DM Sans",sans-serif;font-size:16px;font-weight:700;background:var(--acc);border-color:var(--acc);color:#fff;box-shadow:0 3px 0 #164f35}

/* nav */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--nav);padding-bottom:var(--safe-b);z-index:20;border-radius:18px 18px 0 0;box-shadow:0 -4px 18px rgba(20,33,26,.12)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--nav-h)}
#nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:#a9c4b3;position:relative}
#nav button.on{color:#f6b98c}
#nav button.on::after{content:"";position:absolute;top:6px;width:4px;height:4px;border-radius:2px;background:#f6b98c;display:none}
#nav svg{width:22px;height:22px}

/* sheet */
#scrim{position:fixed;inset:0;background:rgba(23,25,28,.45);z-index:30;display:none;opacity:0;transition:opacity .25s ease}
#scrim.open{opacity:1}
#scrim:not(.open),#sheet:not(.open){pointer-events:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;display:none;max-height:92vh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px calc(18px + var(--safe-b));max-width:560px;margin:0 auto}
#sheet{transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.25,1)}
#sheet.open{transform:none}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:#d4d4ce;margin:0 auto 12px}
.sheet-title{font-size:24px;font-weight:700;margin:2px 0 0}
.opts{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.opt{display:flex;align-items:center;gap:12px;padding:12px 14px;border:0;border-bottom:1px solid var(--line2);background:#fff;text-align:left;width:100%}
.opt:last-child{border-bottom:0}
.opt.on{background:var(--acc-soft)}
.opt .radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0}
.opt.on .radio{border:5px solid var(--acc)}
.darts{display:flex;gap:6px;flex:1;flex-wrap:wrap}
.darts span{font-size:16px;font-weight:600;min-width:38px;text-align:center;background:var(--bg);border-radius:8px;padding:5px 6px}
.opt.on .darts span{background:#fff}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:9px 0}
.slot .l{font-size:12px;color:var(--muted)}
.slot .v{font-size:23px;font-weight:700;min-height:28px}
.slot.on{background:var(--acc-soft);border-color:var(--acc)}
.slot.empty .v{color:var(--faint)}
.numgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.numgrid button{min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:16px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{min-width:46px;min-height:40px}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 14px);transform:translateX(-50%);background:var(--ink);color:#fff;font-size:14px;padding:10px 16px;border-radius:12px;z-index:40;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1}
input[type=text],input[type=password],select{width:100%;border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:#fff;font-size:15px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sess{border:1px solid var(--line);background:#fff;border-radius:14px;overflow:hidden}
.sess>button{width:100%;border:0;background:#fff;text-align:left;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.leg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border:0;border-top:1px solid var(--line2);background:#fff;width:100%;text-align:left;font-size:14px}
.quick{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.quick button{min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:10px;font-size:16px;font-weight:600;padding:0}
.quick button.out{background:var(--acc-soft);border-color:var(--acc);color:var(--acc)}
.wait{opacity:.45;pointer-events:none}
.pane-l,.pane-r{display:contents}
.side{display:none}
.vs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pl{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.pl.me{background:var(--acc-soft);border-color:var(--acc-line)}
.pl.cpu{background:var(--warm-soft);border-color:var(--warm-line)}
.pl.me.on{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-line)}
.pl.cpu.on{border-color:var(--warm);box-shadow:0 0 0 3px var(--warm-line)}
.pl.cpu .route span{color:var(--warm-dark);background:#fff}
.pl.me .route span{background:#fff}
.pl .big{font-size:52px;font-weight:700;line-height:1;letter-spacing:-.03em}
.pl .route{justify-content:flex-start;padding:0;min-height:28px}
.pl .route span{font-size:13px;padding:3px 6px}
.pavg{display:grid;grid-template-columns:1fr 1fr;gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.pavg .l{display:block;font-size:11.5px;color:var(--muted)}.pavg .v{font-family:var(--disp);font-size:21px;font-weight:700;letter-spacing:-.01em}
.pl .cd{font-size:13px;color:var(--muted);min-height:28px;display:flex;align-items:center}
.score{font-size:40px;font-weight:700;text-align:center;letter-spacing:-.02em}
@media (min-width:680px){
  #app{max-width:1120px;padding-left:24px;padding-right:24px}
  #app.play{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr);column-gap:24px}
  #app.play .pane-l,#app.play .pane-r{display:flex;flex-direction:column;gap:10px;min-height:0}
  #app.play .pane-l{overflow-y:auto;padding-bottom:4px}
  #app.play .visits{overflow:visible;flex-shrink:0}
  .side{display:flex;flex-direction:column;gap:10px}
  .statbody,.histlist{display:block;column-count:2;column-gap:14px}
  .statbody>*,.histlist>*{break-inside:avoid;margin-bottom:14px}
  .statbody>.tiles{column-span:all;grid-template-columns:repeat(4,minmax(0,1fr))}
  .setup{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
}
.hero{background:var(--acc);border-color:var(--acc);color:#fff}
.hero .muted,.hero .trio .l{color:#cfe3d6}
.hero .route span{background:rgba(255,255,255,.16);color:#fff}
.hero .route span.nf{background:rgba(255,255,255,.1);color:#cfe3d6}
.hero .trio{border-top:1px solid rgba(255,255,255,.22);padding-top:10px}
.tile.hero{background:var(--acc);border-color:var(--acc);color:#fff}
.tile.hero .l,.tile.hero .s,.tile.hero .s.up{color:#d5e8dc}
.tile.warm{background:var(--warm-soft);border-color:var(--warm-line)}
.tile.warm .v{color:var(--warm-dark)}
.fin{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fin.one{grid-template-columns:1fr}
.fin button{min-height:46px;border-radius:12px;font-size:15px;font-weight:600}
.fin .co{background:var(--acc-soft);color:var(--acc);border:1.5px solid var(--acc)}
.fin .bu{background:var(--warm-soft);color:var(--warm-dark);border:1.5px solid var(--warm-line)}
.pickbtns{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pickbtns button{min-height:68px;border:1.5px solid var(--line);background:#fff;border-radius:14px;font-size:26px;font-weight:700}
.pickbtns button:active{background:var(--acc-soft);border-color:var(--acc)}
.slot.next{border-color:var(--warm);background:var(--warm-soft)}
.bar.warm i{background:var(--warm)}
/* motion and polish */
button{transition:transform .08s ease,background-color .15s,border-color .15s,opacity .15s,color .15s}
button:active:not(:disabled){transform:scale(.97)}
.keypad button:active,.quick button:active{transform:scale(.94)}
.card{box-shadow:0 1px 2px rgba(23,25,28,.04)}
.card.hero{box-shadow:0 10px 26px rgba(31,111,74,.22)}
#app.enter>*{animation:enter .28s ease both}
@keyframes enter{from{opacity:0;transform:translateY(6px)}}
.vrow.new,.rrow.new{animation:slidein .4s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateY(-10px)}}
.shake{animation:shake .45s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.pl.on{animation:breathe 2.4s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 0 6px transparent}}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.96)}}
@keyframes land{0%{transform:scale(1.5);opacity:0}100%{transform:none;opacity:1}}
/* visits */
.visits .more{display:block;width:100%;border:0;background:none;color:var(--acc);font-weight:600;font-size:14px;padding:10px 0 8px;text-align:center}
.card button.more{display:block;width:100%;border:0;background:none;color:var(--acc);font:inherit;font-weight:600;font-size:14px;padding:8px 0 2px;text-align:left;cursor:pointer}
.rhead,.rrow{display:grid;grid-template-columns:18px minmax(0,1fr) minmax(0,1fr);column-gap:12px}
.rhead{font-size:12px;color:var(--muted);padding:9px 0 5px;border-bottom:1px solid var(--line2)}
.rhead span:last-child{color:var(--warm-dark)}
.rrow{padding:7px 0;border-bottom:1px solid var(--line2);align-items:start}
.rrow:last-of-type{border-bottom:0}
.rrow .n{font-size:12px;color:var(--muted);padding-top:3px}
.half{display:grid;grid-template-columns:auto 1fr;column-gap:8px;align-items:baseline;min-width:0}
.half b{font-size:17px;font-weight:600}
.half b.bu{color:var(--warm-dark);text-decoration:line-through;font-size:15px}
.half .l{font-size:14px;color:var(--muted);text-align:right}
.half .d{grid-column:1/-1;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.half.cpu b{color:var(--warm-dark)}
/* order buttons */
.pickbtns button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.pickbtns button small{font-size:11px;font-weight:600;color:var(--acc)}
.pickbtns button:disabled{background:var(--bg);color:var(--faint);border-color:var(--line2)}
/* celebrations, CPU pop-up */
#cele{position:fixed;inset:0;z-index:46;display:flex;align-items:center;justify-content:center;pointer-events:none}
#cele .ban{background:var(--acc);color:#fff;border-radius:24px;padding:18px 34px 20px;text-align:center;box-shadow:0 20px 60px rgba(23,25,28,.28);animation:pop 1.4s cubic-bezier(.2,.9,.3,1.2) forwards}
#cele .ban.warm{background:var(--warm)}
#cele .ban .k{font-size:14px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
#cele .ban .n{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.03em;margin-top:4px}
@keyframes pop{0%{transform:scale(.55);opacity:0}12%{transform:scale(1.07);opacity:1}20%{transform:scale(1)}82%{transform:scale(1);opacity:1}100%{transform:scale(.95) translateY(-12px);opacity:0}}
#confetti{position:fixed;inset:0;z-index:45;pointer-events:none}
#cpupop{position:fixed;inset:0;z-index:42;display:none;align-items:center;justify-content:center;background:rgba(23,25,28,.3);cursor:pointer}
#cpupop.on{display:flex;animation:fade .18s}
#cpupop .box{background:#fff;border-radius:26px;padding:22px 22px 20px;width:min(340px,86vw);text-align:center;box-shadow:0 24px 70px rgba(23,25,28,.3);animation:rise .3s cubic-bezier(.2,.9,.3,1.15)}
#cpupop .who{font-size:13px;color:var(--warm-dark);font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#cpupop .ds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:16px 0}
#cpupop .ds span{min-height:60px;border-radius:14px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700;color:var(--faint)}
#cpupop .ds span.in{background:var(--warm-soft);color:var(--warm-dark);animation:land .32s cubic-bezier(.2,.9,.3,1.3)}
#cpupop .tot{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.03em;min-height:72px;visibility:hidden}
#cpupop .tot.in{visibility:visible;animation:land .34s cubic-bezier(.2,.9,.3,1.3)}
#cpupop .tot.hot{color:var(--warm)}
#cpupop .left{font-size:14px;color:var(--muted);margin-top:8px;min-height:20px}
#cpupop .hint{font-size:12px;color:var(--faint);margin-top:10px}
/* bull up */
.rings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rings button{min-height:50px;border:1px solid var(--line);background:#fff;border-radius:12px;font-size:15px;font-weight:600}
.rings button.wide{grid-column:span 2}
.rings button:first-child{background:var(--acc-soft);border-color:var(--acc-line)}

<script>
"use strict";
const APP_VERSION = "2.0";
/* ===================== helpers ===================== */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const f1 = x => (Math.round(x * 10) / 10).toFixed(1);
const f2 = x => (Math.round(x * 100) / 100).toFixed(2);
const pct = (a, b) => b ? f1(a / b * 100) + "%" : "–";
const sum = a => a.reduce((x, y) => x + y, 0);
const fmtN = n => Number(n).toLocaleString("en-GB");
const DAY = 864e5;
const fmtDate = t => new Date(t).toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
const fmtDateY = t => new Date(t).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" });

let toastT;

const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch (e) {} };

/* ===================== the board ===================== */
const ORDER = [20, 1, 18, 4, 13, 6, 10, 15, 2, 17, 3, 19, 7, 16, 8, 11, 14, 9, 12, 5];
const ALL = []; for (let n = 1; n <= 20; n++) ALL.push("S" + n, "D" + n, "T" + n); ALL.push("SB", "DB", "M");
const IDX = Object.fromEntries(ALL.map((s, i) => [s, i]));
const segVal = s => s === "M" ? 0 : s === "SB" ? 25 : s === "DB" ? 50 : ({ S: 1, D: 2, T: 3 }[s[0]]) * +s.slice(1);
const VAL = Object.fromEntries(ALL.map(s => [s, segVal(s)]));

const isDbl = s => s[0] === "D";
const segLabel = s => s === "M" ? "Miss" : s === "SB" ? "25" : s === "DB" ? "Bull" : s[0] === "S" ? s.slice(1) : s;
const nbrs = n => { const i = ORDER.indexOf(n); return [ORDER[(i + 19) % 20], ORDER[(i + 1) % 20]]; };   // [left, right] as you look at the board
const IMPOSSIBLE = new Set([163, 166, 169, 172, 173, 175, 176, 178, 179]);
const finishTarget = r => r === 50 ? "DB" : (r >= 2 && r <= 40 && r % 2 === 0) ? "D" + r / 2 : null;

/** Where darts tend to land when aimed at a target: used only to rank the suggested combinations. */
const DIST = new Map();
function aimDist(aim) {
  if (DIST.has(aim)) return DIST.get(aim);
  const d = new Map(), add = (s, p) => d.set(s, (d.get(s) || 0) + p);
  if (aim === "SB" || aim === "DB") { add("SB", .28); add("DB", aim === "DB" ? .12 : .08); ORDER.forEach(n => add("S" + n, .026)); add("M", .06); }
  else {
    const k = aim[0], n = +aim.slice(1), [l, r] = nbrs(n), [ll] = nbrs(l), [, rr] = nbrs(r);
    if (k === "T") { add("S" + n, .42); add("T" + n, .13); add("S" + l, .12); add("S" + r, .12); add("T" + l, .035); add("T" + r, .035); add("D" + n, .02); add("S" + ll, .025); add("S" + rr, .025); add("M", .02); }
    else if (k === "D") { add("D" + n, .25); add("S" + n, .3); add("M", .22); add("D" + l, .05); add("D" + r, .05); add("S" + l, .05); add("S" + r, .05); }
    else { add("S" + n, .7); add("T" + n, .06); add("D" + n, .03); add("S" + l, .08); add("S" + r, .08); add("T" + l, .01); add("T" + r, .01); add("M", .01); }
  }
  DIST.set(aim, d); return d;
}
const FLOOR = 0.0012;

/* checkout routes */
const DBL_PREF = { D20: 0, D16: .4, D8: .8, D10: .9, D18: 1.1, D12: 1.2, D4: 1.4, D6: 1.6, D14: 1.7, D2: 2, DB: 2.4 };

  if (s[0] === "T") { const n = +s.slice(1); return n === 20 ? 0 : n === 19 ? .2 : n === 18 ? .4 : n === 17 ? .5 : n >= 15 ? .6 : 1; }

  if (s[0] === "S") return s === "S20" ? .3 : .5;
  return 1.8;   // doubles as setup darts
}
const ROUTE = new Map();
function route(rem, darts, out = "double") {
  const key = rem + "|" + darts + "|" + out;
  if (ROUTE.has(key)) return ROUTE.get(key);
  let best = null, bc = Infinity;
  const segs = ALL.filter(s => s !== "M");
  const finals = out === "double" ? segs.filter(isDbl) : segs;
  for (let n = 1; n <= darts && !best; n++) {
    const rec = (pre, r) => {
      if (pre.length === n - 1) {
        for (const f of finals) if (VAL[f] === r) {
          const c = (out === "double" ? (DBL_PREF[f] ?? 3) : (f[0] === "T" ? 0 : f[0] === "S" ? .3 : 1)) + sum(pre.map(setupCost)) - (pre.length ? VAL[pre[0]] * 1e-4 : 0);   // ties: bigger dart first

        }

      <div class="between"><span style="font-size:15px">CPU visits</span><div class="chips">${opt("cpuPop", "on", "Pop-up")}${opt("cpuPop", "off", "Scoreboard only")}</div></div>
      <button class="btn ghost" data-act="test-sound">Try it</button></div>
    <div class="card stack"><div><p class="h2">Sync between devices</p><p class="sub">Your legs are kept as one file in your private GitHub repository. Changes go up within a minute, or straight away when you switch away from the app, and come down whenever you open it.</p></div>
      ${ghOn() ? `<div class="kv"><span>Repository</span><b>${esc(g.repo)}</b></div><div class="kv"><span>Status</span><b style="${gh.state === "error" ? "color:var(--red)" : ""}">${esc(stTxt)}</b></div>
        <div class="row"><button class="btn primary grow" data-act="gh-sync">Sync now</button><button class="btn ghost grow" data-act="gh-off">Disconnect</button></div>`
      : `<label class="f">Private repository<input type="text" id="ghRepo" placeholder="owner/repository" value="${esc(g.repo || "matt2868/darts-stats-data")}" autocapitalize="off" autocorrect="off" spellcheck="false"></label>
        <label class="f">Access token<input type="password" id="ghTok" placeholder="github_pat_…" autocomplete="off"></label>
        <button class="btn primary" data-act="gh-connect">Connect</button>${gh.state === "error" ? `<p class="sub" style="color:var(--red);margin:0">${esc(gh.detail)}</p>` : ""}`}</div>
    <div class="card stack"><div><p class="h2">Backup</p><p class="sub">A file with every leg, visit and dart. Importing merges it with what's here.</p></div>
      <div class="row"><button class="btn ghost grow" data-act="export">Export JSON</button><button class="btn ghost grow" data-act="import">Import</button></div>
      <p class="sub" style="margin:0">${fmtN(liveLegs().length)} legs on this device · version ${APP_VERSION}</p></div></div>`;
}
function exportJSON() {
  const body = JSON.stringify({ app: "darts-stats", v: 1, exportedAt: new Date().toISOString(), legs: [...S.legs.values()] }, null, 1);
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([body], { type: "application/json" }));
  a.download = `darts-stats-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000); toast("Backup saved");
}
async function importJSON(file) {
  try {
    const j = JSON.parse(await file.text()); const legs = Array.isArray(j) ? j : j.legs;
    if (!Array.isArray(legs)) throw new Error();
    const ch = mergeLegs(legs);
    if (idb && ch.length) await idbPut(ch).catch(() => {});
    writeMirror(); scheduleGh(1000); render(); toast(ch.length ? `Imported ${ch.length} leg${ch.length === 1 ? "" : "s"}` : "Nothing new in that file");
  } catch (e) { toast("That file isn't a Darts Stats backup"); }
}

/* ===================== GitHub sync ===================== */
const gh = { cfg: null, timer: null, busy: false, again: false, state: "off", detail: "", last: 0 };
function ghLoad() { try { gh.cfg = JSON.parse(localStorage.getItem(LS_GH) || "null"); } catch (e) { gh.cfg = null; } if (gh.cfg) gh.state = "on"; }
function ghSave(c) { gh.cfg = c; try { if (c) localStorage.setItem(LS_GH, JSON.stringify(c)); else localStorage.removeItem(LS_GH); } catch (e) {} }
const ghOn = () => !!(gh.cfg && gh.cfg.token && gh.cfg.repo);
const ghHeaders = () => ({ Authorization: "Bearer " + gh.cfg.token, Accept: "application/vnd.github+json", "X-GitHub-Api-Version": "2022-11-28" });
async function ghApi(path, opts = {}) {
  let r;
  try { r = await fetch(`https://api.github.com/repos/${gh.cfg.repo}/contents/${path}`, { ...opts, cache: "no-store", headers: { ...ghHeaders(), ...(opts.body ? { "Content-Type": "application/json" } : {}) } }); }
  catch (e) { const x = new Error("Offline: will sync when you're back online."); x.offline = true; throw x; }
  if ((r.status === 404 || r.status === 409) && (!opts.method || opts.method === "GET")) return null;   // 409 here means a brand-new, empty repository
  if (!r.ok) {
    const x = new Error(r.status === 401 ? "GitHub refused the token. It may have expired: make a new one and connect again."
      : r.status === 403 ? "The token can't write to that repository. Check it has Contents: Read and write."
      : r.status === 404 ? "Couldn't find that repository. Check the name, and that the token can see it."
      : `GitHub replied ${r.status}.`);
    x.status = r.status; throw x;
  }
  return r.status === 204 ? {} : r.json();
}
const b64enc = bytes => { let t = ""; for (let i = 0; i < bytes.length; i += 0x8000) t += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(t); };
const b64dec = b => Uint8Array.from(atob(String(b).replace(/\s/g, "")), c => c.charCodeAt(0));
async function ghRead(path) {
  const f = await ghApi(path); if (!f) return null;
  if (f.content) return { bytes: b64dec(f.content), sha: f.sha };
  const bl = await fetch(f.git_url, { cache: "no-store", headers: ghHeaders() }).then(r => r.json());   // files over 1 MB come via their blob
  return { bytes: b64dec(bl.content), sha: f.sha };
}
function scheduleGh(ms = 4000) { if (!ghOn()) return; clearTimeout(gh.timer); gh.timer = setTimeout(ghSync, ms); }
/** Pull the shared file, keep the newer copy of every leg, then write back anything this device has that's newer. */
async function ghSync() {
  if (!ghOn()) return;
  if (gh.busy) { gh.again = true; return; }
  gh.busy = true; gh.state = "syncing"; if (S.tab === "more") render();
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const f = await ghRead("legs.json");
      const R = f ? JSON.parse(new TextDecoder().decode(f.bytes)) : { legs: [] };
      const remote = R.legs || [];
      const ch = mergeLegs(remote);
      if (ch.length) { if (idb) await idbPut(ch).catch(() => {}); writeMirror(); if (S.tab !== "play" || !activeLeg() || ch.some(l => l.id === S.meta.active)) render(); }
      const rmap = new Map(remote.map(l => [l.id, Number(l.u) || 0]));
      const need = !f || [...S.legs.values()].some(l => (rmap.has(l.id) ? rmap.get(l.id) : -1) < (Number(l.u) || 0));
      if (!need) break;
      const body = JSON.stringify({ v: 1, savedAt: Date.now(), legs: [...S.legs.values()] });
      try { await ghApi("legs.json", { method: "PUT", body: JSON.stringify({ message: "Sync", content: b64enc(new TextEncoder().encode(body)), ...(f ? { sha: f.sha } : {}) }) }); break; }
      catch (e) { if ((e.status === 409 || e.status === 422) && attempt < 3) continue; throw e; }   // another device saved first: pull again and merge
    }
    gh.state = "on"; gh.detail = ""; gh.last = Date.now();
  } catch (e) {
    gh.state = e.offline ? "retry" : "error"; gh.detail = e.message || "Couldn't reach GitHub.";
    if (e.offline) scheduleGh(30000);
  } finally {
    gh.busy = false;
    if (S.tab === "more") render();
    if (gh.again) { gh.again = false; scheduleGh(1500); }
  }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") { if (ghOn() && gh.timer) { clearTimeout(gh.timer); ghSync(); } } else { scheduleGh(800); wake(); } });

/* keep the screen on while a leg is in play */
let wl = null;
async function wake() {
  const want = S.tab === "play" && !!activeLeg() && document.visibilityState === "visible";
  try {
    if (want && !wl && navigator.wakeLock) { wl = await navigator.wakeLock.request("screen"); wl.addEventListener("release", () => { wl = null; }); }
    else if (!want && wl) { await wl.release(); wl = null; }
  } catch (e) { wl = null; }
}

/* ===================== events ===================== */
document.addEventListener("pointerdown", () => actx(), { passive: true });
document.addEventListener("click", e => {
  if (e.target.closest("#cpupop")) { S.cpuSkip && S.cpuSkip(); return; }
  const sg = e.target.closest("[data-seg]");
  if (sg) { const k = sg.dataset.seg; S.stats.seg = S.stats.seg === k ? null : k; render(); return; }
  const nc = e.target.closest("[data-num]");
  if (nc) { openNum(+nc.dataset.num); return; }
  const vs = e.target.closest("[data-vsc]");
  if (vs) { openScore(+vs.dataset.vsc); return; }
  const ns = e.target.closest("[data-nsc]");
  if (ns && S.sheet && S.sheet.kind === "num") { const x = +ns.dataset.nsc; openNum(S.sheet.n, S.sheet.sc === x ? null : x); return; }
  const cg = e.target.closest("[data-cgrp]");
  if (cg && S.sheet) { const P = S.sheet; P.cOpen = P.cOpen === cg.dataset.cgrp ? null : cg.dataset.cgrp; if (P.kind === "num") openNum(P.n, P.sc, P.allC); else if (P.kind === "vsc") openScore(P.n, P.allC); return; }
  const nt = e.target.closest("[data-ntab]");
  if (nt) { S.numTab = nt.dataset.ntab; render(); return; }
  const wr = e.target.closest("[data-wrap]");
  if (wr) { closeSheet(); openWrap(wr.dataset.wrap); return; }
  if (e.target.closest("#wrap")) { wrapTap(e); return; }
  const t = e.target.closest("button, [data-act]");
  if (!t) { if (e.target.id === "scrim" && S.sheet && S.sheet.kind !== "sum") closeSheet(); return; }
  const d = t.dataset;
  if (d.tab) { S.tab = d.tab; closeSheet(); render(); window.scrollTo(0, 0); return; }
  if (d.key) { onKey(d.key); return; }
  if (d.set) { const v = (d.set === "start" || d.set === "first") ? +d.val : d.val; S.set[d.set] = v; saveSettings(); render(); return; }
  if (d.quick) { if (cpuTurnNow()) return; sfx("click"); S.input = d.quick; submitScore(); return; }
  if (d.stab) { S.stats.tab = d.stab; render(); return; }
  if (d.heat) { S.stats.heat = d.heat; render(); return; }
  if (d.sgrp != null) { S.stats.sgrp = d.sgrp ? +d.sgrp : null; S.stats.seg = null; render(); return; }
  if (d.ring) { S.stats.ring = d.ring; render(); return; }
  if (d.dbl) { S.stats.dbl = d.dbl; render(); return; }
  if (d.tgt) { S.stats.tgt = d.tgt; S.stats.seg = null; render(); return; }
  if (d.dblt != null) { S.stats.dblT = d.dblt || null; S.stats.seg = null; render(); return; }
  if (d.dexf) { S.dexf = d.dexf; render(); return; }
  if (d.bull != null) { bullThrow(+d.bull); return; }
  if (d.hsess) { S.hist.open = S.hist.open === d.hsess ? null : d.hsess; render(); return; }
  if (d.hleg) { openLeg(d.hleg); return; }
  const P = S.sheet;
  if (d.popt != null && P) { chooseCombo(+d.popt); return; }
  if (d.pord != null && P) { tapOrder(+d.pord); return; }
  if (d.bmult && P) { P.b.mult = d.bmult; drawPicker(); return; }
  if ((d.bnum || d.bseg) && P) { if (P.b.darts.length >= 3 || P.auto || P.mis) return; const x = d.bseg || ((d.bnum && P.b.mult) + d.bnum); P.b.darts.push(x); P.b.aims.push(P.aim || null); P.b.mult = "S"; sfx("click"); buildCheck(); return; }
  if (d.bslot != null && P) { P.b.darts = P.b.darts.slice(0, +d.bslot); P.b.aims = P.b.aims.slice(0, +d.bslot); P.mis = null; P.auto = false; drawPicker(); return; }
  if (d.paim != null && P && P.kind === "pick") { P.aim = d.paim || null; P.aimSet = true; drawPicker(); return; }
  if (d.dsel != null && P) { const k = +d.dsel; P.sel[k] = !P.sel[k]; drawQuestions(); return; }
  if (d.q && P) { P[d.q] = +d.qv; if (d.q === "du" && P.dd != null && P.dd > P.du) P.dd = null; drawQuestions(); return; }
  const a = d.act; if (!a) return;
  const leg = P ? S.legs.get(P.leg) : activeLeg();
  if (a === "start" || a === "next-leg") { closeSheet(); startLeg(); }
  else if (a === "end-session") endSession();
  else if (a === "toggle-visits") { S.showAll = !S.showAll; render(); }
  else if (a === "m-report") { const ml = matchLegs(d.id); S.sheet = { kind: "report" }; openSheet(`<div class="stack" style="gap:14px"><div><span class="s13 muted">${fmtDate(ml[0].at)} · first to ${ml[0].m.first}</span><p class="sheet-title">Match report</p></div>${matchReport(d.id)}<button class="btn primary" data-act="close">Done</button></div>`); }
  else if (a === "s-report") { const ls = liveLegs().filter(l => l.sid === d.id && l.v.length); S.sheet = { kind: "report" }; openSheet(`<div class="stack" style="gap:14px"><div><span class="s13 muted">${fmtDate(ls[0].at)}</span><p class="sheet-title">Session summary</p></div>${sessionReport(ls)}<button class="btn primary" data-act="close">Done</button></div>`); }
  else if (a === "c-more" && S.sheet) { const P = S.sheet; if (P.kind === "num") openNum(P.n, P.sc, !P.allC); else if (P.kind === "vsc") openScore(P.n, !P.allC); }
  else if (a === "bands") { S.set.bands = S.set.bands === "19" ? "20" : "19"; saveSettings(); STATCACHE.clear(); render(); toast(S.set.bands === "19" ? "Score bands: 57, 95, 133, 171" : "Score bands: 60, 100, 140, 180"); }
  else if (a === "seg-clear") { S.stats.seg = null; render(); }
  else if (a === "wrap-list") openWrapList();
  else if (a === "bull-again") { S.sheet.step = "me"; drawBull(); }
  else if (a === "bull-go") { closeSheet(); startMatchLeg(); }
  else if (a === "test-sound") { const was = S.set.sfx; S.set.sfx = "on"; celebrate("Maximum", 180, "", 2400, 220); S.set.sfx = was; say("One hundred and eighty!", true); }
  else if (a === "m-start" || a === "m-rematch") { closeSheet(); startMatch(); }
  else if (a === "m-next") { if (matchOver(M())) return; const l = activeLeg(); if (l && l.m) { closeSheet(); S.tab = "play"; render(); } else startMatchLeg(); }
  else if (a === "m-end") { const l = activeLeg(); if (l && l.m) { l.end = true; persist([l]); } S.meta.match = null; S.meta.active = null; saveMeta(); closeSheet(); render(); }
  else if (a === "checkout") { const l = activeLeg(); if (!l || cpuTurnNow()) return; S.input = String(legRem(l)); submitScore(); }
  else if (a === "bust") {
    const l = activeLeg(); if (!l || cpuTurnNow()) return; S.input = "";
    const draft = { s: 0, r: legRem(l), t: Date.now(), b: true };
    if (S.set.ask === "never") askOrSave(l, draft, false); else openBust(l, draft);
  }
  else if (a === "leg-menu") {
    S.sheet = { kind: "menu" };
    openSheet(`<div class="stack"><p class="sheet-title">This leg</p>${M() && activeLeg() && activeLeg().m ? `<button class="btn ghost" data-act="m-end">End the match</button>` : `<button class="btn ghost" data-act="abandon">Stop this leg (keep its visits)</button>`}<button class="btn ghost danger" data-act="discard">Discard this leg</button><button class="btn" data-act="close">Cancel</button></div>`);
  }
  else if (a === "abandon") { S.meta.active = null; saveMeta(); closeSheet(); render(); toast("Leg stopped. It stays in your history."); }
  else if (a === "discard") { const l = activeLeg(); if (l) { l.del = true; persist([l]); if (l.m && M()) S.meta.match = null; } S.meta.active = null; saveMeta(); closeSheet(); render(); toast("Leg discarded"); }
  else if (a === "close") closeSheet();
  else if (a === "p-build") { P.step = "build"; P.b = { mult: "S", darts: [], aims: [] }; drawPicker(); }
  else if (a === "b-back" || a === "p-back") { P.step = "list"; drawPicker(); }
  else if (a === "p-reset") { P.used = []; P.order = []; P.auto = false; drawPicker(); }
  else if (a === "b-clear") { P.b.darts = []; P.b.aims = []; P.mis = null; P.auto = false; drawPicker(); }
  else if (a === "aim-more") { P.aimMore = !P.aimMore; drawPicker(); }
  else if (a === "mis-use") { const v = P.v, e = P.mis; v.s = e.s; v.d = e.d; setAims(v, P.b.aims.slice(0, e.d.length)); v.f = e.f || undefined; v.b = e.b || undefined; if (!v.f) delete v.du; P.mis = null; askOrSave(leg, v, true); }
  else if (a === "mis-fix") { P.b.darts.pop(); P.b.aims.pop(); P.mis = null; drawPicker(); }
  else if (a === "p-skip") askOrSave(leg, P.v, false);
  else if (a === "q-save") {
    const v = P.v;
    if (P.q.kind === "darts") { v.dda = P.sel.slice(); v.dd = P.sel.filter(Boolean).length; }
    else { if (v.f && !v.d) v.du = P.du; v.dd = P.dd; }
    saveVisit(leg, v);
  }
  else if (a === "undo-out") { const l = S.legs.get(P.leg); l.v.pop(); l.done = false; delete l.fin; if (l.m && M() && l.m.res === "won") { M().me--; delete l.m.res; M().turn = "me"; } S.meta.active = l.id; saveMeta(); persist([l]); closeSheet(); S.tab = "play"; render(); }
  else if (a === "resume") { const l = S.legs.get(d.id); if (l.m && (!M() || M().id !== l.m.id)) { toast("That leg was part of a finished match"); return; } S.meta.active = l.id; S.meta.sid = l.sid; S.meta.sLast = Date.now(); saveMeta(); closeSheet(); S.tab = "play"; render(); }
  else if (a === "del-leg") {
    if (t.dataset.sure) { const l = S.legs.get(d.id); l.del = true; if (S.meta.active === l.id) { S.meta.active = null; saveMeta(); } persist([l]); closeSheet(); render(); toast("Leg deleted"); }
    else { t.dataset.sure = "1"; t.textContent = "Tap again to delete"; }
  }
  else if (a === "export") exportJSON();
  else if (a === "import") $("#importFile").click();
  else if (a === "gh-connect") {
    const repo = ($("#ghRepo").value || "").trim().replace(/^https?:\/\/github\.com\//, "").replace(/\.git$/, "").replace(/\/$/, ""), token = ($("#ghTok").value || "").trim();
    if (!/^[\w.-]+\/[\w.-]+$/.test(repo)) { toast("Enter the repository as owner/name"); return; }
    if (!token) { toast("Paste your access token"); return; }
    ghSave({ repo, token }); gh.state = "syncing"; render(); ghSync().then(() => toast(gh.state === "on" ? "Connected and synced" : gh.detail));
  }
  else if (a === "gh-sync") ghSync().then(() => toast(gh.state === "on" ? "Synced" : gh.detail));
  else if (a === "gh-off") { ghSave(null); gh.state = "off"; render(); toast("GitHub sync turned off on this device"); }
});
document.addEventListener("change", e => {
  if (e.target.matches("[data-tgtsel]") && e.target.value) { S.stats.tgt = e.target.value; S.stats.seg = null; render(); }
  if (e.target.matches("[data-period]")) { S.stats.period = S.set.period = e.target.value; saveSettings(); render(); }
  if (e.target.id === "importFile" && e.target.files[0]) { importJSON(e.target.files[0]); e.target.value = ""; }
});
document.addEventListener("keydown", e => {
  if (S.tab !== "play" || !activeLeg() || S.sheet || cpuTurnNow() || /input|select|textarea/i.test(document.activeElement?.tagName || "")) return;
  if (/^\d$/.test(e.key)) onKey(e.key); else if (e.key === "Backspace") onKey("back"); else if (e.key === "Enter") onKey("next");
});

/* ===================== boot ===================== */
async function boot() {
  try { Object.assign(S.set, JSON.parse(localStorage.getItem(LS_SET) || "{}")); } catch (e) {}
  if (S.set.period) S.stats.period = S.set.period;
  try { Object.assign(S.meta, JSON.parse(localStorage.getItem(LS_META) || "{}")); } catch (e) {}
  try { idb = await openIDB(); mergeLegs(await idbAll()); } catch (e) { idb = null; }
  let mirror = []; try { mirror = JSON.parse(localStorage.getItem(LS_LEGS) || "[]"); } catch (e) {}
  const fromMirror = mergeLegs(mirror);
  if (idb && fromMirror.length) idbPut(fromMirror).catch(() => {});
  ghLoad(); render();
  if (M() && M().turn === "cpu" && activeLeg()) setTimeout(cpuTurn, 800);
  if (ghOn()) ghSync();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
boot();
